
name: GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lohith848
          filename: github-metrics.svg

          template: classic
          base: ""
          
          plugin_lines: yes
          plugin_lines_sections: base
          
          config_timezone: Asia/Kolkata
