
name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          USER = "Lohith848"
          TOKEN = os.environ["GH_TOKEN"]

          def api(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "github-stats-action"
                  }
              )
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          # Get all public repositories
          repos = []
          page = 1

          while True:
              data = api(
                  f"https://api.github.com/users/{USER}/repos"
                  f"?per_page=100&page={page}"
              )

              if not data:
                  break

              repos.extend(data)
              page += 1

          stars = sum(repo["stargazers_count"] for repo in repos)
          forks = sum(repo["forks_count"] for repo in repos)
          repos_count = len(repos)

          # User information
          user = api(f"https://api.github.com/users/{USER}")
          followers = user["followers"]

          svg = f"""
          <svg width="600" height="100"
               viewBox="0 0 600 100"
               xmlns="http://www.w3.org/2000/svg">

            <style>
              .number {{
                font: 600 22px -apple-system, BlinkMacSystemFont,
                      "Segoe UI", sans-serif;
                fill: #58A6FF;
              }}

              .label {{
                font: 14px -apple-system, BlinkMacSystemFont,
                      "Segoe UI", sans-serif;
                fill: #8B949E;
              }}
            </style>

            <text x="75" y="38" text-anchor="middle" class="number">{repos_count}</text>
            <text x="75" y="65" text-anchor="middle" class="label">Repositories</text>

            <text x="225" y="38" text-anchor="middle" class="number">{stars}</text>
            <text x="225" y="65" text-anchor="middle" class="label">Stars</text>

            <text x="375" y="38" text-anchor="middle" class="number">{forks}</text>
            <text x="375" y="65" text-anchor="middle" class="label">Forks</text>

            <text x="525" y="38" text-anchor="middle" class="number">{followers}</text>
            <text x="525" y="65" text-anchor="middle" class="label">Followers</text>

          </svg>
          """

          with open("github-stats.svg", "w") as f:
              f.write(svg)
          PY

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats.svg
          git diff --cached --quiet && exit 0

          git commit -m "chore: update GitHub stats"
          git push
