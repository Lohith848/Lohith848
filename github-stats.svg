
<svg width="600" height="100"
     viewBox="0 0 600 100"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .number {
      font: 600 22px -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
      fill: #58A6FF;
    }

    .label {
      font: 14px -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
      fill: #8B949E;
    }
  </style>

  <text x="75" y="38" text-anchor="middle" class="number">30</text>
  <text x="75" y="65" text-anchor="middle" class="label">Repositories</text>

  <text x="225" y="38" text-anchor="middle" class="number">12</text>
  <text x="225" y="65" text-anchor="middle" class="label">Stars</text>

  <text x="375" y="38" text-anchor="middle" class="number">1</text>
  <text x="375" y="65" text-anchor="middle" class="label">Forks</text>

  <text x="525" y="38" text-anchor="middle" class="number">6</text>
  <text x="525" y="65" text-anchor="middle" class="label">Followers</text>

</svg>
